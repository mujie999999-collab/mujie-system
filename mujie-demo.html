<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沐頡景觀設計｜專案管理系統</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #0c110e;
  --surface: #131a15;
  --surface2: #192010;
  --surface3: #1f2a20;
  --border: #273029;
  --border2: #3a4e3d;
  --sage: #4e9c5e;
  --sage2: #6db87e;
  --sage3: #a0d4ac;
  --sage-pale: rgba(78,156,94,0.12);
  --sage-glow: rgba(78,156,94,0.2);
  --earth: #c49a5a;
  --earth2: #ddb87a;
  --earth-pale: rgba(196,154,90,0.13);
  --blue: #4a8fc4;
  --blue-pale: rgba(74,143,196,0.13);
  --gcal: #4285f4;
  --gcal-pale: rgba(66,133,244,0.13);
  --line-c: #06c755;
  --line-pale: rgba(6,199,85,0.12);
  --red: #e05c4a;
  --red-pale: rgba(224,92,74,0.13);
  --amber: #d4920a;
  --amber-pale: rgba(212,146,10,0.13);
  --text: #dde8de;
  --text2: #8fa893;
  --text3: #4e5e50;
  --sidebar-w: 220px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* ── SCREENS ── */
.screen{display:none;width:100%;height:100%;}
.screen.active{display:flex;}

/* ════════════════════════════
   LOGIN
════════════════════════════ */
#screen-login{
  align-items:center;justify-content:center;
  background: radial-gradient(ellipse at 30% 40%, rgba(78,156,94,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 70%, rgba(196,154,90,0.05) 0%, transparent 50%),
              var(--bg);
  flex-direction:column;
}
.login-logo{
  font-family:'Syne',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:4px;color:var(--sage2);text-transform:uppercase;
  margin-bottom:6px;
}
.login-sub{font-size:11px;color:var(--text3);letter-spacing:2px;margin-bottom:40px;font-family:'DM Mono',monospace;}
.login-box{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:32px 36px;width:360px;max-width:92vw;
}
.login-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.login-desc{font-size:12px;color:var(--text3);margin-bottom:24px;}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.user-btn{
  padding:12px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface3);cursor:pointer;transition:all 0.15s;text-align:left;
}
.user-btn:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-1px);}
.user-btn.selected{border-color:var(--sage);background:var(--sage-pale);box-shadow:0 0 0 1px var(--sage);}
.user-btn.selected-earth{border-color:var(--earth);background:var(--earth-pale);box-shadow:0 0 0 1px var(--earth);}
.ub-dept{font-size:9px;letter-spacing:2px;margin-bottom:3px;text-transform:uppercase;}
.ub-name{font-size:13px;font-weight:700;}
.ub-title{font-size:10px;color:var(--text3);margin-top:1px;}
.login-btn{
  width:100%;padding:13px;border-radius:6px;border:none;
  background:var(--sage);color:#fff;font-family:'Noto Sans TC',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;
  opacity:0.4;pointer-events:none;
}
.login-btn.ready{opacity:1;pointer-events:auto;}
.login-btn.ready:hover{background:var(--sage2);transform:translateY(-1px);}

/* ════════════════════════════
   APP SHELL
════════════════════════════ */
#screen-app{flex-direction:row;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
.sb-logo{
  padding:20px 18px 16px;border-bottom:1px solid var(--border);
}
.sb-logo-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--sage2);letter-spacing:1px;}
.sb-logo-sub{font-size:10px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace;}
.sb-user{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.sb-avatar{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.sb-user-name{font-size:13px;font-weight:700;}
.sb-user-role{font-size:10px;color:var(--text3);}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-section{font-size:9px;letter-spacing:2px;color:var(--text3);padding:8px 8px 4px;text-transform:uppercase;font-family:'DM Mono',monospace;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:5px;cursor:pointer;
  font-size:13px;color:var(--text2);transition:all 0.12s;margin-bottom:2px;
}
.nav-item:hover{background:var(--surface3);color:var(--text);}
.nav-item.active{background:var(--sage-pale);color:var(--sage2);border:1px solid rgba(78,156,94,0.2);}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{
  margin-left:auto;font-size:10px;padding:1px 6px;border-radius:10px;
  background:var(--red);color:#fff;font-family:'DM Mono',monospace;
}
.sb-notify{
  padding:12px 14px;border-top:1px solid var(--border);font-size:11px;
}
.notify-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:3px;font-size:10px;font-weight:600;margin:2px;
}
.nc-line{background:var(--line-pale);color:var(--line-c);}
.nc-email{background:var(--blue-pale);color:var(--blue);}
.nc-gcal{background:var(--gcal-pale);color:var(--gcal);}

/* MAIN CONTENT */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{
  padding:0 24px;height:54px;flex-shrink:0;
  border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar-title{font-size:16px;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.tb-btn{
  padding:6px 14px;border-radius:4px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:12px;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;transition:all 0.12s;
}
.tb-btn:hover{border-color:var(--border2);color:var(--text);}
.tb-btn.primary{background:var(--sage);border-color:var(--sage);color:#fff;}
.tb-btn.primary:hover{background:var(--sage2);}

.content{flex:1;overflow-y:auto;padding:24px;}

/* ── TAB PAGES ── */
.tab-page{display:none;}
.tab-page.active{display:block;}

/* ── DASHBOARD ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
@media(max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:16px 18px;
}
.sc-label{font-size:11px;color:var(--text3);margin-bottom:8px;letter-spacing:0.5px;}
.sc-val{font-size:28px;font-weight:900;font-family:'Syne',sans-serif;line-height:1;}
.sc-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.sc-bar{height:3px;border-radius:2px;margin-top:10px;background:var(--border);}
.sc-bar-fill{height:100%;border-radius:2px;transition:width 1s ease;}

.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.card-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-title{font-size:13px;font-weight:700;}
.card-body{padding:16px 18px;}

/* project list */
.proj-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.proj-item:last-child{border-bottom:none;}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.proj-info{flex:1;min-width:0;}
.proj-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.proj-status{
  font-size:10px;padding:2px 8px;border-radius:2px;white-space:nowrap;flex-shrink:0;font-weight:600;
}
.ps-active{background:var(--sage-pale);color:var(--sage2);}
.ps-warn{background:var(--amber-pale);color:var(--amber);}
.ps-done{background:var(--surface3);color:var(--text3);}
.ps-red{background:var(--red-pale);color:var(--red);}

.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.prog-label{font-size:12px;width:70px;flex-shrink:0;}
.prog-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width 1s ease;}
.prog-pct{font-size:11px;color:var(--text3);width:36px;text-align:right;flex-shrink:0;font-family:'DM Mono',monospace;}

/* notice list */
.notice-item{
  display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);
}
.notice-item:last-child{border-bottom:none;}
.ni-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.ni-text{font-size:12px;color:var(--text2);line-height:1.5;}
.ni-time{font-size:10px;color:var(--text3);margin-top:2px;font-family:'DM Mono',monospace;}

/* ── SCHEDULE ── */
.sched-toolbar{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
}
.st-month{font-size:16px;font-weight:700;}
.st-nav{
  width:30px;height:30px;border-radius:4px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all 0.12s;
}
.st-nav:hover{border-color:var(--border2);color:var(--text);}
.view-tabs{display:flex;gap:2px;margin-left:auto;}
.vt-btn{
  padding:5px 12px;border-radius:3px;border:none;font-size:12px;cursor:pointer;
  background:transparent;color:var(--text3);font-family:'Noto Sans TC',sans-serif;transition:all 0.12s;
}
.vt-btn.active{background:var(--surface3);color:var(--text);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
.cal-head{background:var(--surface2);padding:8px 4px;text-align:center;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
.cal-cell{
  background:var(--surface);min-height:80px;padding:6px;position:relative;
  cursor:pointer;transition:background 0.1s;
}
.cal-cell:hover{background:var(--surface3);}
.cal-cell.today{background:rgba(78,156,94,0.06);border:1px solid rgba(78,156,94,0.25);}
.cal-cell.other-month .cal-day{color:var(--text3);}
.cal-day{font-size:11px;font-weight:600;margin-bottom:4px;font-family:'DM Mono',monospace;}
.cal-event{
  font-size:10px;padding:2px 5px;border-radius:2px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer;
}
.ce-sage{background:rgba(78,156,94,0.2);color:var(--sage3);}
.ce-earth{background:rgba(196,154,90,0.2);color:var(--earth2);}
.ce-blue{background:rgba(74,143,196,0.2);color:#7ab4e0;}
.ce-red{background:rgba(224,92,74,0.2);color:#f08070;}
.ce-gcal{background:rgba(66,133,244,0.2);color:#82b1ff;}

/* gantt */
.gantt-wrap{overflow-x:auto;}
.gantt-table{width:100%;border-collapse:collapse;font-size:12px;}
.gantt-table th{
  background:var(--surface2);color:var(--text3);padding:8px 12px;
  text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;
}
.gantt-table td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;}
.gantt-table tr:hover td{background:var(--surface3);}
.g-bar-wrap{width:200px;}
.g-bar{height:14px;background:var(--border);border-radius:3px;overflow:hidden;}
.g-fill{height:100%;border-radius:3px;}
.g-pct{font-size:10px;color:var(--text3);margin-left:6px;font-family:'DM Mono',monospace;}

/* ── RESOURCE ── */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
.member-card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;
}
.mc-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.mc-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
.mc-name{font-size:14px;font-weight:700;}
.mc-role{font-size:10px;color:var(--text3);margin-top:1px;}
.mc-status{
  display:inline-block;font-size:10px;padding:2px 8px;border-radius:2px;font-weight:600;
}
.ms-onsite{background:var(--sage-pale);color:var(--sage2);}
.ms-office{background:var(--blue-pale);color:var(--blue);}
.ms-off{background:var(--surface3);color:var(--text3);}
.mc-site{font-size:11px;color:var(--text2);margin-top:8px;}

/* weather widget */
.weather-bar{
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.wb-day{text-align:center;min-width:50px;}
.wb-icon{font-size:20px;}
.wb-temp{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;}
.wb-label{font-size:9px;color:var(--text3);}
.wb-warn{
  margin-left:auto;background:var(--amber-pale);border:1px solid rgba(212,146,10,0.3);
  color:var(--amber);font-size:11px;padding:6px 12px;border-radius:4px;
}

/* ── NOTIFICATION PANEL ── */
.notif-list{}
.notif-item{
  display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background 0.1s;border-radius:4px;
}
.notif-item:hover{background:var(--surface3);padding-left:8px;padding-right:8px;}
.ni-badge{
  width:34px;height:34px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;
}
.nib-sage{background:var(--sage-pale);}
.nib-amber{background:var(--amber-pale);}
.nib-red{background:var(--red-pale);}
.nib-gcal{background:var(--gcal-pale);}
.nib-line{background:var(--line-pale);}
.notif-body{flex:1;}
.notif-title{font-size:13px;font-weight:600;}
.notif-desc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.5;}
.notif-time{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0;padding-top:2px;}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex-shrink:0;margin-top:6px;}

/* tooltip/modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:100;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--border2);border-radius:10px;
  padding:24px;width:440px;max-width:92vw;max-height:80vh;overflow-y:auto;
  animation:fadeSlide 0.2s ease;
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.modal-title{font-size:16px;font-weight:700;}
.modal-close{
  width:28px;height:28px;border-radius:4px;border:none;background:var(--surface3);
  color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{color:var(--text);}
.mf-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.mf-label{font-size:10px;color:var(--text3);letter-spacing:1px;font-family:'DM Mono',monospace;}
.mf-val{font-size:13px;color:var(--text);}
.mf-chips{display:flex;flex-wrap:wrap;gap:4px;}

/* chip */
.chip{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:2px;
  display:inline-block;
}
.ch-sage{background:var(--sage-pale);color:var(--sage2);}
.ch-earth{background:var(--earth-pale);color:var(--earth2);}
.ch-blue{background:var(--blue-pale);color:var(--blue);}
.ch-red{background:var(--red-pale);color:var(--red);}
.ch-amber{background:var(--amber-pale);color:var(--amber);}
.ch-line{background:var(--line-pale);color:var(--line-c);}
.ch-gcal{background:var(--gcal-pale);color:var(--gcal);}
.ch-dim{background:var(--surface3);color:var(--text3);}


/* ── 日/週通知面板 ── */
.sched-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
@media(max-width:900px){ .sched-wrap { grid-template-columns: 1fr; } }
.notify-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  position: sticky;
  top: 0;
}
.np-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.np-title { font-size: 13px; font-weight: 700; }
.np-tabs { display: flex; gap: 2px; }
.np-tab {
  padding: 4px 10px; border-radius: 3px; font-size: 11px;
  cursor: pointer; border: none; font-family: 'Noto Sans TC', sans-serif;
  background: transparent; color: var(--text3); transition: all 0.1s;
}
.np-tab.active { background: var(--surface3); color: var(--text); }
.np-body { padding: 12px 14px; max-height: 600px; overflow-y: auto; }
.np-section { margin-bottom: 14px; }
.np-section-label {
  font-size: 9px; letter-spacing: 2px; color: var(--text3);
  text-transform: uppercase; font-family: 'DM Mono', monospace;
  margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
}
.np-event {
  display: flex; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--border); font-size: 11px;
}
.np-event:last-child { border-bottom: none; }
.np-event-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.np-event-text { flex: 1; color: var(--text2); line-height: 1.5; }
.np-event-date { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; flex-shrink: 0; }
.np-channel {
  display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;
}
.np-tag {
  font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 2px;
}
.np-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 20px 0; }

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-logo">沐頡景觀設計</div>
  <div class="login-sub">MUJIE LANDSCAPE · PROJECT SYSTEM</div>
  <div class="login-box">
    <div class="login-title">選擇帳號登入</div>
    <div class="login-desc">請選擇您的帳號以進入系統</div>
    <div class="user-grid" id="userGrid">
      <div class="user-btn" data-user="kuo" onclick="selectUser(this)">
        <div class="ub-dept" style="color:var(--earth);">設計部</div>
        <div class="ub-name">郭菊美</div>
        <div class="ub-title">設計總監</div>
      </div>
      <div class="user-btn" data-user="tsai-h" onclick="selectUser(this)">
        <div class="ub-dept" style="color:var(--earth);">設計部</div>

function selectUser(btn) {

    dashboard:'OVERVIEW', schedule:'SCHEDULE', projects:'PROJECTS',
    resource:'RESOURCE', reports:'REPORTS', notifications:'NOTIFY'
  };
  let lastSection = '';
  u.nav.forEach(key => {
    const sec = sectionMap[key];
    if (sec !== lastSection) {
      nav.innerHTML += `<div class="nav-section">${sec}</div>`;
      lastSection = sec;
    }
    const badge = key==='notifications' ? ' <span class="nav-badge">'+getUnreadCount()+'</span>' : '';

function navigateTo(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === tab);
  });
  document.getElementById('topTitle').textContent = NAV_LABELS[tab]?.label || '';
  const content = document.getElementById('mainContent');

    dashboard: renderDashboard,
    schedule:  renderSchedule,
    projects:  renderProjects,
    resource:  renderResource,
    reports:   renderReports,
    notifications: renderNotifications,
  };
  if (renderers[tab]) renderers[tab](content);
}

function switchNotifyTab(tab) {
  npCurrentTab = tab;
  document.getElementById('npTabDay').classList.toggle('active', tab==='day');
  document.getElementById('npTabWeek').classList.toggle('active', tab==='week');
  renderNotifyPanel(tab);
}

function renderNotifyPanel(tab) {
  const panel = document.getElementById('npBody');
  if (!panel) return;

  const isDesign = ['kuo','tsai-h'].includes(currentUser);
  const isEng    = ['tsai-c','chiu','meng'].includes(currentUser);
  const u = USERS[currentUser];

  // 取得日期範圍
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + 6);
  const weekEndStr = weekEnd.toISOString().split('T')[0];

  // 篩選事件
  const allEvents = getCalEvents();
  let filtered = [];
  if (tab === 'day') {
    filtered = allEvents.filter(e => e.date === todayStr);
  } else {
    filtered = allEvents.filter(e => e.date >= todayStr && e.date <= weekEndStr);
  }

  // 通知管道標示
  const channels = isDesign
    ? '<span class="np-tag" style="background:var(--line-pale);color:var(--line-c);">💬 Line</span><span class="np-tag" style="background:var(--blue-pale);color:var(--blue);">📧 Email</span>'
    : '<span class="np-tag" style="background:var(--line-pale);color:var(--line-c);">💬 Line</span>';

  const dateLabel = tab === 'day'
    ? todayStr
    : `${todayStr} ～ ${weekEndStr}`;

  if (filtered.length === 0) {
    panel.innerHTML = `
      <div class="np-channel">${channels}</div>
      <div style="margin-top:6px;font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;">${dateLabel}</div>
      <div class="np-empty">${tab==='day'?'今日':'本週'}無排程工項</div>`;
    return;
  }

  // 依日期分組（週視圖）
  let html = `<div class="np-channel">${channels}</div>
    <div style="margin-top:6px;margin-bottom:12px;font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;">${dateLabel}</div>`;

  if (tab === 'day') {
    html += `<div class="np-section">
      <div class="np-section-label">${isDesign?'設計部':'工程部'} · 今日工項（${filtered.length}筆）</div>`;

      html += `<div class="np-event">
        <div class="np-event-dot" style="background:${getDotColor(e.cls)};"></div>
        <div class="np-event-text">${e.text}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    // 週視圖按日期分組
    const byDate = {};
    filtered.forEach(e => {
      if (!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });
    const days = ['日','一','二','三','四','五','六'];
    Object.keys(byDate).sort().forEach(date => {
      const d = new Date(date);
      const dayName = days[d.getDay()];
      html += `<div class="np-section">
        <div class="np-section-label">週${dayName} ${date.slice(5)} （${byDate[date].length}筆）</div>`;
      byDate[date].forEach(e => {
        html += `<div class="np-event">
          <div class="np-event-dot" style="background:${getDotColor(e.cls)};"></div>
          <div class="np-event-text">${e.text}</div>
        </div>`;
      });
      html += `</div>`;
    });
  }

  // 提醒說明
  const reminderTime = isDesign
    ? '每日 07:00 Line + Email · 每週一 07:00 週預覽'
    : '每日 07:00 Line · 每週一 07:00 週預覽';
  html += `<div style="margin-top:8px;padding:8px 10px;background:var(--surface3);border-radius:4px;font-size:10px;color:var(--text3);">
    🕖 ${reminderTime}

  panel.innerHTML = html;
}

function getDotColor(cls) {
  const map = {
    'ce-sage':'var(--sage)', 'ce-earth':'var(--earth)',
    'ce-blue':'var(--blue)', 'ce-red':'var(--red)',
    'ce-amber':'var(--amber)', 'ce-gcal':'var(--gcal)',
  };
  return map[cls] || 'var(--text3)';
}

function renderCalBody() {
  const el = document.getElementById('calBody');
  if (!el) return;
  if (calView==='month') renderMonthView(el);
  else renderGanttView(el);
}

function renderMonthView(el) {
  const events = getCalEvents();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();
  let html = `<div class="cal-grid">`;
  ['日','一','二','三','四','五','六'].forEach(d=>{html+=`<div class="cal-head">${d}</div>`;});
  // prev month fill
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  for(let i=firstDay-1;i>=0;i--) {
    html+=`<div class="cal-cell other-month"><div class="cal-day">${prevDays-i}</div></div>`;
  }
  for(let d=1;d<=daysInMonth;d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getDate()===d && today.getMonth()===calMonth && today.getFullYear()===calYear;
    const dayEvents = events.filter(e=>e.date===dateStr);
    html+=`<div class="cal-cell${isToday?' today':''}">
      <div class="cal-day" style="${isToday?'color:var(--sage2);':''}">${d}</div>
      ${dayEvents.map(e=>`<div class="cal-event ${e.cls}" onclick="event.stopPropagation();openProjectModal(${e.proj})">${e.text}</div>`).join('')}
    </div>`;
  }
  // fill remainder
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total%7);
  for(let i=1;i<=remaining;i++) html+=`<div class="cal-cell other-month"><div class="cal-day">${i}</div></div>`;
  html+=`</div>`;
  el.innerHTML = html;
}

function renderGanttView(el) {
  const projects = currentUser==='meng' ? MENG_PROJECTS : PROJECTS;
  el.innerHTML = `<div class="gantt-wrap"><table class="gantt-table">
    <thead><tr><th>案件名稱</th><th>負責人</th><th>截止日</th><th>完成度</th><th>狀態</th></tr></thead>

function changeMonth(d) {
  calMonth+=d;

// gapi 載入完成
function gapiLoaded() {

// GIS 載入完成
function gisLoaded() {

    client_id: GCAL_CONFIG.CLIENT_ID,

      gcalAuthorized = true;

// 觸發授權（如果尚未授權）

    });

// 讀取 Google Calendar 事件
async function loadGCalEvents() {
  const now = new Date();
  const timeMin = new Date(now.getFullYear(), now.getMonth() - 6, 1).toISOString();
  const timeMax = new Date(now.getFullYear(), now.getMonth() + 6, 0).toISOString();
  try {
    const res = await gapi.client.calendar.events.list({
      calendarId: GCAL_CONFIG.CALENDAR_ID,
      timeMin, timeMax,
      singleEvents: true,
      orderBy: 'startTime',
      maxResults: 500,
    });
    const items = res.result.items || [];
    // 轉換為系統格式
    gcalEvents = items.map(e => ({
      id:    e.id,
      date:  e.start?.date || e.start?.dateTime?.split('T')[0] || '',
      text:  e.summary || '（無標題）',
      cls:   gcalColorToCls(e.colorId),
      proj:  0,
      gcalId: e.id,
      raw:   e,
    }));
    console.log(`✅ 載入 ${gcalEvents.length} 筆 Google Calendar 事件`);
    return gcalEvents;
  } catch (err) {
    console.error('GCal 讀取失敗:', err);
    showToast('日曆讀取失敗，請重新授權');
    gcalAuthorized = false;
    return [];
  }
}

// Google Calendar 顏色 ID → CSS class
function gcalColorToCls(colorId) {
  const map = {
    '1':'ce-sage', '2':'ce-sage', '3':'ce-sage',
    '4':'ce-red',  '5':'ce-amber','6':'ce-earth',
    '7':'ce-blue', '8':'ce-blue', '9':'ce-blue',
    '10':'ce-sage','11':'ce-red',
  };
  return map[colorId] || 'ce-gcal';
}

// 取得當前要顯示的日曆事件（真實或假資料）
function getCalEvents() {
  if (gcalAuthorized && gcalEvents.length > 0) {
    // 角色篩選
    return filterGCalByRole(gcalEvents, currentUser);
  }
  // 尚未授權：用假資料
  return currentUser === 'meng' ? MENG_CAL_EVENTS : CAL_EVENTS;
}

// 依角色篩選 Google Calendar 事件
function filterGCalByRole(events, userId) {
  if (['kuo', 'tsai-c'].includes(userId)) return events; // 全部
  if (userId === 'tsai-h') return events; // 設計師看全部（可再細化）
  if (userId === 'chiu') return events;   // 主任看全部（可設定負責案件）
  if (userId === 'meng') {
    // 阿孟只看負責工地
    const mySites = WORKERS.filter(w => w.name && w.site !== '—').map(w => w.site);
    const allowedSites = mySites.length > 0 ? mySites : ['綠蔭社區'];
    return events.filter(e => {
      const text = (e.text || '') + (e.raw?.location || '') + (e.raw?.description || '');
      return allowedSites.some(s => text.includes(s));
    });
  }
  return events;
}

// 寫入新工項至 Google Calendar
async function writeEventToGCal(taskData) {
  if (!gcalAuthorized) {
    authorizeGCal();
    return null;
  }
  try {
    const event = {
      summary: `${taskData.projectName || ''} ${taskData.title}`,
      description: `案件：${taskData.projectName || ''}\n負責人：${taskData.assignee || ''}\n--- 沐頡景觀設計系統 ---`,
      location: taskData.site || '',
      start: { date: taskData.date, timeZone: 'Asia/Taipei' },
      end:   { date: taskData.date, timeZone: 'Asia/Taipei' },
      colorId: '2',
      extendedProperties: { private: { mujieSystem: 'true', projectName: taskData.projectName || '' } },
    };
    const res = await gapi.client.calendar.events.insert({
      calendarId: GCAL_CONFIG.CALENDAR_ID,
      resource: event,
    });
    await loadGCalEvents(); // 重新載入
    return res.result;
  } catch (err) {
    console.error('GCal 寫入失敗:', err);
    showToast('寫入 Google Calendar 失敗');
    return null;
  }
}

  closeModalDirect();

  // 重新初始化
  setTimeout(() => {
    initGapiFromConfig();
  }, 500);
}

// 從 localStorage 載入已儲存的 token
function loadSavedToken() {
  try {
    const t = JSON.parse(localStorage.getItem('mujie_gcal_token') || 'null');
    if (!t) return null;
    // 檢查是否過期（預留 5 分鐘緩衝）
    if (Date.now() > t.expires_at - 300000) {
      localStorage.removeItem('mujie_gcal_token');
      return null;
    }
    return t;
  } catch { return null; }
}

// 從 localStorage 載入已儲存的設定
function loadSavedConfig() {
  try {
    return JSON.parse(localStorage.getItem('mujie_gcal_config') || '{}');
  } catch { return {}; }
}

// 用儲存的設定初始化 gapi
function initGapiFromConfig() {
  const saved = loadSavedConfig();
  if (saved.CLIENT_ID) GCAL_CONFIG.CLIENT_ID = saved.CLIENT_ID;
  if (saved.API_KEY)   GCAL_CONFIG.API_KEY   = saved.API_KEY;
  if (GCAL_CONFIG.API_KEY && GCAL_CONFIG.CLIENT_ID) {
    if (typeof gapi !== 'undefined') {
      gapi.load('client', async () => {
        await gapi.client.init({
          apiKey: GCAL_CONFIG.API_KEY,
          discoveryDocs: [GCAL_CONFIG.DISCOVERY_DOC],
        });
        gapiInited = true;
        if (typeof google !== 'undefined') {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GCAL_CONFIG.CLIENT_ID,
            scope: GCAL_CONFIG.SCOPES,
            callback: async (resp) => {
              if (resp.error) return;
              gcalAuthorized = true;
              if (resp.access_token) {
                localStorage.setItem('mujie_gcal_token', JSON.stringify({
                  access_token: resp.access_token,
                  expires_at: Date.now() + (resp.expires_in || 3600) * 1000,
                }));
              }
              showToast('Google Calendar 已授權 ✓ 正在載入日曆...');
              await loadGCalEvents();
              updateGCalBtn();
              setTimeout(() => { navigateTo('schedule'); }, 300);
            },
          });
          gisInited = true;
          // 檢查是否有已儲存的 token
          const savedToken = loadSavedToken();
          if (savedToken) {
            gapi.client.setToken({ access_token: savedToken.access_token });
            gcalAuthorized = true;
            showToast('Google Calendar 自動連結成功 ✓');
            loadGCalEvents().then(() => {
              updateGCalBtn();
              if (currentTab === 'schedule') {
                setTimeout(() => navigateTo('schedule'), 300);
              }
            });
          } else {
            showToast('Google Calendar API 就緒，點排程日曆開始授權 ✓');
          }
        }
      });
    }
  }
}

    btn.style.color = 'var(--gcal)';
  } else {
    text.textContent = `已連結（${gcalEvents.length} 筆）`;
    btn.style.borderColor = 'var(--sage)';
    btn.style.color = 'var(--sage2)';
  }
}

// 新增工項並同步至 Google Calendar
async function saveNewEvent() {
  const titleEl   = document.querySelector('#modalBody input[placeholder="輸入工項名稱"]');
  const projectEl = document.querySelector('#modalBody select');
  const dateEl    = document.querySelector('#modalBody input[type="date"]');
  const title   = titleEl?.value.trim() || '新工項';
  const project = projectEl?.value || '';
  const date    = dateEl?.value || new Date().toISOString().split('T')[0];
  closeModalDirect();
  showToast('儲存中...');
  const taskData = { title, projectName: project, date, assignee: USERS[currentUser]?.name, site: '' };
  if (gcalAuthorized) {
    const result = await writeEventToGCal(taskData);
    if (result) {
      showToast(`工項「${title}」已新增並同步至 Google Calendar ✓`);
      if (currentTab === 'schedule') navigateTo('schedule');
      return;
    }
  }
  showToast(`工項「${title}」已新增（Google Calendar 未連結）`);
}

// ═══════════════════════════════════
//  TOAST
// ═══════════════════════════════════
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--sage);color:#fff;padding:12px 20px;border-radius:6px;font-size:13px;font-weight:600;z-index:999;animation:fadeSlide 0.3s ease;box-shadow:0 4px 20px rgba(0,0,0,0.4);';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
</script>
